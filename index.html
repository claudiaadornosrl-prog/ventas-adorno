};

window.salvarDifMp = async function salvarDifMp(fecha, localId, estado) {
  const nombre = (document.getElementById('mp-rev-nombre')?.value || '').trim();
  const motivo = (document.getElementById('mp-rev-motivo')?.value || '').trim();
  if (!nombre) { alert('Poné tu nombre para que quede registrado quién revisó.'); return; }
  if (estado === 'justificada' && !motivo) { alert('Para justificar la diferencia el motivo es obligatorio.'); return; }
  localStorage.setItem('ventas_revisor_nombre', nombre);
  try {
    const { error } = await sb.rpc('ventas_salvar_dif_mp', {
      p_local: localId, p_fecha: fecha, p_estado: estado, p_motivo: motivo, p_quien: nombre });
    if (error) throw error;
    abrirDetalleMp(fecha, localId);  // reabrir con el estado nuevo
  } catch (e) { alert('No se pudo guardar: ' + (e.message || e)); }
};

function renderGrillaLocal(ventas, año, mes, localId, aplicadas, pendientes, turnos) {
  aplicadas = aplicadas || [];
  pendientes = pendientes || [];
  turnos = turnos || [];
  // ¿Mostramos la columna Tarjeta en este mes?
  const primerDiaMes = `${año}-${String(mes).padStart(2,'0')}-01`;
  const mostrarTarjeta = primerDiaMes <= FECHA_FIN_TARJETA;
  // Map de correcciones aplicadas por (fecha, campo)
  const mapAp = {};
  aplicadas.forEach(c => { mapAp[`${c.fecha}_${c.campo}`] = c; });
  // Map de pendientes por (fecha, campo)
  const mapPe = {};
  pendientes.forEach(c => { mapPe[`${c.fecha}_${c.campo}`] = c; });
  // Map de turnos por fecha (arreglo ordenado por numero)
  const mapTurnos = {};
  turnos.forEach(t => {
    if (!mapTurnos[t.fecha]) mapTurnos[t.fecha] = [];
    mapTurnos[t.fecha].push(t);
  });
  // Guardar global para que abrirTurnos() pueda leer sin re-query
  window._turnosPorFecha = mapTurnos;
  window._localActual = localId;

  const cont = document.getElementById('contenido');
  const diasMes = new Date(año, mes, 0).getDate();
  const hoy = hoyISO();
  const porFecha = {};
  ventas.forEach(v => { porFecha[v.fecha] = v; });

  // KPIs del mes
  let totShopping = 0, totTotal = 0, totEfectivo = 0, totTarjeta = 0, totQR = 0,
      totTransferencia = 0, totCC = 0,
      totVales = 0, totOnline = 0, totFcOf = 0, totCant = 0, totCantFis = 0;
  ventas.forEach(v => {
    totShopping      += +v.shopping || 0;
    totTotal         += +v.total    || 0;
    totEfectivo      += +v.efectivo || 0;
    totTarjeta       += +v.tarjeta  || 0;
    totQR            += +v.qr       || 0;
    totTransferencia += +v.transferencia || 0;
    totCC            += +v.cc       || 0;
    totVales         += +v.vales    || 0;
    totOnline        += +v.online   || 0;
    totFcOf          += +v.fc_oficina || 0;
    totCant          += (+v.cant_transacciones||0) + (+v.cant_online||0) + (+v.cant_fc_oficina||0);
    totCantFis       += +v.cant_transacciones || 0;
  });
  const ticketProm = totCantFis > 0 ? Math.round(totShopping / totCantFis) : 0;
  const diasConVenta = ventas.filter(v => (v.shopping||0) > 0).length;
  const promDiario = diasConVenta > 0 ? Math.round(totTotal / diasConVenta) : 0;

  // ── Auto-ocultar columnas sin movimiento (31-jul, pedido JP) ──
  // Con más de 3 días de ventas cargados en el mes, las columnas que siguen
  // en cero se esconden; reaparecen solas apenas algún día toma un valor
  // (positivo o negativo). Al arrancar el mes (≤3 días) se muestran todas.
  const _diasCargados = ventas.length;
  const _colVisible = (suma) => _diasCargados <= 3 || Math.abs(suma) > 0.009;
  const showEfectivo = _colVisible(totEfectivo);
  const showQR       = _colVisible(totQR);
  const showTransf   = _colVisible(totTransferencia);
  const showCC       = _colVisible(totCC);
  const showVales    = _colVisible(totVales);
  const showOnline   = _colVisible(totOnline);
  const showFcOf     = _colVisible(totFcOf);

  // Render
  let acum = 0;
  const filas = [];
  for (let d = 1; d <= diasMes; d++) {
    const fecha = `${año}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const v = porFecha[fecha];
    const shopping = v ? +v.shopping || 0 : 0;
    const total = v ? +v.total || 0 : 0;
    acum += total;
    const esHoy = fecha === hoy;
    const klass = [
      !v ? 'row-empty' : '',
      esHoy ? 'row-today' : '',
      v?.controlado ? 'row-controlado' : '',
      // Precargado = tiene datos pero NO está controlado (aún no se cerró formalmente).
      // El texto va en gris suave para que se note visualmente vs los cerrados.
      (v && !v.controlado) ? 'row-precargado' : '',
    ].filter(Boolean).join(' ');
    // Helper: render de una celda numérica con resaltado por corrección
    const celda = (campo, valor) => {
      const k = `${fecha}_${campo}`;
      const ap = mapAp[k];
      const pe = mapPe[k];
      let style = '';
      let title = '';
      let badge = '';
      if (ap) {
        style = 'background:#fef3c7;';   // amarillo claro
        title = `Corregido manualmente: ${fmt$(ap.valor_anterior)} → ${fmt$(ap.valor_propuesto)}\nMotivo: ${ap.motivo}\nPor: ${ap.solicitado_por||'?'} · Aprobó: ${ap.resuelto_por||'?'}`;
      }
      if (pe) {
        style += 'border:2px solid #f59e0b;';
        badge = ' ✎';
        title = (title?title+'\n\n':'') + `Solicitud pendiente: ${fmt$(pe.valor_anterior)} → ${fmt$(pe.valor_propuesto)}\nMotivo: ${pe.motivo}\nPor: ${pe.solicitado_por}`;
      }
      // Determinar acción al click según rol y campo
      let onclick;
      if (session.isAdmin) {
        // Admin: click en cualquier celda abre el editar completo
        onclick = `event.stopPropagation(); abrirEditar('${fecha}','${localId}',${JSON.stringify(v||null).replace(/"/g,'&quot;')})`;
      } else if (campo === 'fc_oficina') {
        // Vendedora: fc_oficina sigue editable (mini modal con SOLO ese campo)
        onclick = `event.stopPropagation(); abrirEditarFcOficina('${fecha}','${localId}',${JSON.stringify(v||null).replace(/"/g,'&quot;')})`;
      } else {
        // Vendedora + otra celda: pedir corrección
        const valActual = v ? (v[campo] || 0) : 0;
        onclick = `event.stopPropagation(); abrirSolicitudCorreccion('${fecha}','${localId}','${campo}',${valActual})`;
      }
      const display = v ? (campo === 'cant_transacciones' ? (valor || '—') : fmt$(valor)) : '—';
      // Tilde de arqueo MP: cuando el día ya se cruzó contra la cuenta MP
      // (se hace con 1 día de demora, al cerrar el día siguiente), mostramos
      // ✓ verde si no hubo diferencia o ⚠ naranja si la hubo.
      if (campo === 'qr' && v?.mp_cruzado_at) {
        const difMp = +(v.mp_diferencia_dia || 0);
        const cuandoMp = new Date(v.mp_cruzado_at).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
        const clickMp = `event.stopPropagation(); abrirDetalleMp('${fecha}','${localId}')`;
        if (Math.abs(difMp) < 1) {
          badge += ` <span style="color:#16a34a;font-weight:700;cursor:pointer;" title="Cruzado con la cuenta MP (${cuandoMp}): sin diferencias. Click para ver el detalle." onclick="${clickMp}">✓</span>`;
        } else {
          const difFmtMp = (difMp < 0 ? '-' : '+') + '$' + Math.abs(difMp).toLocaleString('es-AR');
          if (v.mp_dif_estado === 'justificada') {
            badge += ` <span style="color:#7c3aed;font-weight:700;cursor:pointer;" title="Diferencia ${difFmtMp} JUSTIFICADA por ${(v.mp_dif_por||'')}: ${(v.mp_dif_motivo||'').replace(/"/g,'')}. Click para ver." onclick="${clickMp}">✔</span>`;
          } else if (v.mp_dif_estado === 'error') {
            badge += ` <span style="color:#dc2626;font-weight:700;cursor:pointer;" title="Diferencia ${difFmtMp} marcada como ERROR por ${(v.mp_dif_por||'')}. Click para ver." onclick="${clickMp}">✖</span>`;
          } else {
            badge += ` <span style="color:#d97706;font-weight:700;cursor:pointer;" title="Cruzado con la cuenta MP (${cuandoMp}): diferencia ${difFmtMp} SIN REVISAR. Click para revisarla." onclick="${clickMp}">⚠</span>`;
          }
        }
      }
      return `<td class="editable" style="${style}cursor:pointer;" title="${escHtml(title)}" onclick="${onclick}">${display}${badge}</td>`;
    };


    // ── Columna de turnos ──
    // Si hay turnos cerrados, mostramos badge con cantidad y si hay discrepancia
    // Si es HOY y hay venta cargada, mostramos botón "🔒 Cerrar turno"
    const turnosDelDia = mapTurnos[fecha] || [];
    const nTurnos = turnosDelDia.length;
    const conDiscrep = turnosDelDia.filter(t =>
      t.estado_discrepancia && t.estado_discrepancia !== 'ok'
    ).length;

    let celdaTurno = '<td class="cell-derived">—</td>';
    // Entramos al bloque si hay turnos previos, hay venta cargada, o ES HOY
    // (para HOY siempre queremos ofrecer el botón "🔒 Cerrar" — al apretar
    // se hace pre-sync de Dragonfish+MP que trae las ventas que aún no
    // se hayan sincronizado por el scheduled task horario).
    if (nTurnos > 0 || v || esHoy) {
      const diaCerrado = !!v?.controlado;
      const badgeColor = conDiscrep > 0 ? '#fee2e2' : (diaCerrado ? '#e0e7ff' : '#dcfce7');
      const badgeTxt   = conDiscrep > 0 ? '#991b1b' : (diaCerrado ? '#3730a3' : '#166534');
      const badgeIcon  = diaCerrado ? '✓ ' : '';
      const badge = nTurnos > 0
        ? `<span title="${nTurnos} turno${nTurnos>1?'s':''}${conDiscrep>0?' — con diferencia en el arqueo':''}" style="background:${badgeColor};color:${badgeTxt};padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;">${badgeIcon}${nTurnos}${conDiscrep>0?' ⚠':''}</span>`
        : (diaCerrado ? `<span style="background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;">✓ cerrado</span>` : '');
      // Botón "Cerrar turno" disponible si es HOY y el día NO está cerrado.
      // Antes requeríamos venta cargada, pero eso bloqueaba a Oficina cuando
      // todavía no había corrido el sync horario. El pre-sync forzado dentro
      // de cerrarTurnoAhora() trae las ventas que aún no estén en la planilla.
      const esPasado = fecha < hoy;
      // Cerrar turno: solo HOY. Cerrar día: HOY o días pasados que quedaron
      // sin cerrar (olvido o problema de sync) — pedido JP 4-ago.
      const puedeCerrar = esHoy && !diaCerrado;
      const puedeCerrarDia = (esHoy || (esPasado && v)) && !diaCerrado;
      const botonCerrar = puedeCerrar
        ? abtn(`cerrarTurnoAhora('${fecha}','${localId}')`, 'Cerrar turno', 'clock', 'principal')
        : '';
      const botonCerrarDia = puedeCerrarDia
        ? abtn(`cerrarDiaAhora('${fecha}','${localId}')`, 'Cerrar día — no se podrán abrir más turnos', 'lock', 'peligro')
        : '';
      const verLink = nTurnos > 0
        ? abtn(`abrirTurnos('${fecha}','${localId}')`, 'Ver detalle de turnos', 'eye')
        : '';
      const linkReabrir = (diaCerrado && session?.isAdmin)
        ? abtn(`reabrirDiaAhora('${fecha}','${localId}')`, 'Reabrir día', 'unlock', 'alerta')
        : '';
      const botonSolicitar = (diaCerrado && !session?.isAdmin)
        ? abtn(`solicitarReaperturaAhora('${fecha}','${localId}')`, 'Pedir reapertura — le llega la solicitud al admin', 'key', 'violeta')
        : '';
      celdaTurno = `<td style="text-align:center;white-space:nowrap;">${badge}${verLink}${botonCerrar}${botonCerrarDia}${linkReabrir}${botonSolicitar}</td>`;
    }

    filas.push(`
      <tr class="${klass}">
        <td>${fmtFecha(fecha)}</td>
        ${showEfectivo ? celda('efectivo', v?.efectivo) : ''}
        ${mostrarTarjeta ? celda('tarjeta', v?.tarjeta) : ''}
        ${showQR ? celda('qr', v?.qr) : ''}
        ${showTransf ? celda('transferencia', v?.transferencia) : ''}
        ${showCC ? celda('cc', v?.cc) : ''}
        ${showVales ? celda('vales', v?.vales) : ''}
        <td class="cell-derived">${v ? fmt$(shopping) : '—'}</td>
        ${celda('cant_transacciones', v ? ((+v.cant_transacciones||0)+(+v.cant_online||0)+(+v.cant_fc_oficina||0)) : undefined).replace('<td class="editable"', '<td class="editable cell-derived"')}
        ${showOnline ? celda('online', v?.online) : ''}
        ${showFcOf ? celda('fc_oficina', v?.fc_oficina) : ''}
        <td class="cell-derived big">${v ? fmt$(total) : '—'}</td>
        <td class="cell-derived">${v ? fmt$(acum) : '<span style="color:#cbd5e1">—</span>'}</td>   <!-- (22-oct, JP) sin venta cargada no se repite el acumulado -->
        ${celdaTurno}
      </tr>
    `);
  }

  const _kt = document.getElementById('hdr-kpi-total');
  const _kp = document.getElementById('hdr-kpi-prom');
  if (_kt) { _kt.style.display = ''; _kt.innerHTML = `Total <b>$${fmt$(totTotal)}</b>`; _kt.title = `${diasConVenta} días con venta · ${totCant} transacciones · ticket promedio $${fmt$(ticketProm)}`; }
  if (_kp) { _kp.style.display = ''; _kp.innerHTML = `Prom/día <b>$${fmt$(promDiario)}</b>`; }

  cont.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>${showEfectivo ? '<th>Efectivo</th>' : ''}${mostrarTarjeta ? '<th>Tarjeta</th>' : ''}${showQR ? '<th>MP</th>' : ''}${showTransf ? '<th>Transferencia</th>' : ''}${showCC ? '<th>CC</th>' : ''}${showVales ? '<th>Vales</th>' : ''}
            <th class="th-der">Shopping</th><th class="th-der">Cant</th>${showOnline ? '<th>Online</th>' : ''}${showFcOf ? '<th>Fc Oficina</th>' : ''}<th class="th-der">Total</th><th class="th-der">Acumulado</th>
            <th style="white-space:nowrap;">Turnos</th>
          </tr>
        </thead>
        <tbody>${filas.join('')}</tbody>
        <tfoot>
          <tr class="row-total">
            <td>TOTAL</td>
            ${showEfectivo ? `<td>${fmt$(totEfectivo)}</td>` : ''}
            ${mostrarTarjeta ? `<td>${fmt$(totTarjeta)}</td>` : ''}
            ${showQR ? `<td>${fmt$(totQR)}</td>` : ''}
            ${showTransf ? `<td>${fmt$(totTransferencia)}</td>` : ''}
            ${showCC ? `<td>${fmt$(totCC)}</td>` : ''}
            ${showVales ? `<td>${fmt$(totVales)}</td>` : ''}
            <td>${fmt$(totShopping)}</td>
            <td>${totCant}</td>
            ${showOnline ? `<td>${fmt$(totOnline)}</td>` : ''}
            ${showFcOf ? `<td>${fmt$(totFcOf)}</td>` : ''}
            <td colspan="2" style="text-align:center">${fmt$(totTotal)}</td>   <!-- (22-oct, JP) total + acumulado en una sola celda -->
            <td>—</td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}

// ─── Vista admin consolidada (todos los locales) ─────────────────────
// (21-oct-2026, JP) Las tarjetas Total general / Alcorta / Unicenter / Oficina se ven también adentro de cada local
// (la del local elegido queda marcada; "Total general" vuelve al consolidado).
// (24-oct, JP) Color para un local NUEVO. Los 3 fijos tienen sus reglas en el CSS (col-/kpi-/body[data-local]);
// cualquier otro local que aparezca en los datos recibe una paleta de esta lista (en orden de aparición) y las mismas
// reglas se generan acá con color-mix a partir de un solo color. Para cambiar el color de un local nuevo, este es el lugar.
const PALETAS_LOCAL_NUEVO = ['#d97706', '#7c3aed', '#db2777', '#0891b2', '#65a30d'];   // ámbar, violeta, rosa, cian, lima
const _paletaAsignada = {};
function asegurarEstiloLocal(locales) {
  let st = document.getElementById('estilo-locales');
  if (!st) { st = document.createElement('style'); st.id = 'estilo-locales'; document.head.appendChild(st); }
  (locales || []).forEach(loc => {
    if (!loc || ['alcorta', 'unicenter', 'oficina'].includes(loc) || _paletaAsignada[loc]) return;
    const F = PALETAS_LOCAL_NUEVO[Object.keys(_paletaAsignada).length % PALETAS_LOCAL_NUEVO.length];
    _paletaAsignada[loc] = F;
    const mix = (pct, con = 'white') => `color-mix(in srgb, ${F} ${pct}%, ${con})`;
    const L = CSS.escape(loc);
    st.textContent += `
th.col-${L} { background: ${mix(16)}; color: ${mix(75, 'black')}; } td.col-${L} { background: ${mix(7)}; } td.cell-derived.col-${L} { background: ${mix(16)}; border-left-color: ${mix(40)}; }
tbody tr:nth-child(even) td.col-${L} { background: ${mix(11)}; } tbody tr:nth-child(even) td.cell-derived.col-${L} { background: ${mix(22)}; }
.row-total td.col-${L} { background: ${mix(30)}; } .kpi-row .kpi.kpi-${L} { border-top: 4px solid ${F} !important; }   /* gana a la regla :not() del Total general */
body[data-local="${L}"] .header { background: linear-gradient(90deg, ${F}, ${mix(85, 'black')}); }
body[data-local="${L}"] .table-wrap th { background: ${mix(16)}; color: ${mix(75, 'black')}; border-bottom-color: ${mix(40)}; }
body[data-local="${L}"] .row-total { background: ${mix(30)}; }
body[data-local="${L}"] .table-wrap { background: ${mix(7)}; } body[data-local="${L}"] .table-wrap td { border-bottom-color: ${mix(16)}; } body[data-local="${L}"] tbody tr:nth-child(even) { background: ${mix(16)}; }

function kpiRowHtml(tot, activo) {
  asegurarEstiloLocal(Object.keys(tot));
  const granTotal = Object.values(tot).reduce((a, b) => a + (b || 0), 0);
  const _nombre = (loc) => LOCALES[loc]?.nombre || (loc.charAt(0).toUpperCase() + loc.slice(1));
  const _ico = (loc, h) => logoLocal(loc, h) || `<span style="font-weight:700;text-transform:none;letter-spacing:0;font-size:14px">${_nombre(loc)}</span>`;
  const card = (loc, icono, nombre) => `<div class="kpi kpi-${loc} ${activo === loc ? 'kpi-activa' : ''}" style="cursor:pointer;" title="${activo === loc ? 'Estás viendo ' + nombre : 'Ver el detalle de ' + nombre}" onclick="irALocal('${loc}')"><div class="kpi-label">${icono}</div><div class="kpi-value">${fmt$(tot[loc])}</div></div>`;
  const _extra = Object.keys(tot).filter(l => !['alcorta', 'unicenter', 'oficina'].includes(l)).map(l => card(l, _ico(l, 18), _nombre(l))).join('');
  const _nTarjetas = 1 + Object.keys(tot).length;
  return `<div class="kpi-row${_nTarjetas % 2 ? ' kpi-impar' : ''}">
      <div class="kpi ${activo === 'todos' ? 'kpi-activa' : ''}" style="cursor:pointer;" title="${activo === 'todos' ? 'Estás viendo el consolidado' : 'Volver al consolidado'}" onclick="document.getElementById('sel-local').value='todos';cargar()"><div class="kpi-label"><span class="lbl-largo">Total general</span><span class="lbl-corto">Total</span></div><div class="kpi-value">${fmt$(granTotal)}</div></div>
      ${card('alcorta', logoLocal('alcorta', 18), 'Alcorta')}${card('unicenter', logoLocal('unicenter', 18), 'Unicenter')}${card('oficina', logoLocal('oficina', 18), 'Oficina')}${_extra}
    </div>`;
}
function renderAdminConsolidado(ventas, año, mes) {
  const _kt = document.getElementById('hdr-kpi-total'); if (_kt) _kt.style.display = 'none';
  const _kp = document.getElementById('hdr-kpi-prom'); if (_kp) _kp.style.display = 'none';
  const cont = document.getElementById('contenido');
  const diasMes = new Date(año, mes, 0).getDate();
  // Estructura: porFechaLocal[fecha][local] = total
  const porFecha = {};
  ventas.forEach(v => {
    if (!porFecha[v.fecha]) porFecha[v.fecha] = {};
    porFecha[v.fecha][v.local] = +v.total || 0;
  });

  // (22-oct, JP) si en el período hay un local nuevo, se suma solo (tarjeta y columnas)
  const locales = [...new Set(['alcorta', 'unicenter', 'oficina', ...ventas.map(v => v.local).filter(Boolean)])];
  asegurarEstiloLocal(locales);
  const totLocales = Object.fromEntries(locales.map(l => [l, 0]));
  const acumLocales = Object.fromEntries(locales.map(l => [l, 0]));
  const filas = [];
  for (let d = 1; d <= diasMes; d++) {
    const fecha = `${año}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dia = porFecha[fecha] || {};
    const cells = locales.map(loc => {
      const v = dia[loc] || 0;
      totLocales[loc] += v;
      acumLocales[loc] += v;
      return `<td class="col-${loc}">${v ? fmt$(v) : '<span style="color:#cbd5e1">—</span>'}</td><td class="cell-derived col-${loc}">${v ? fmt$(acumLocales[loc]) : '<span style="color:#cbd5e1">—</span>'}</td>`;
    }).join('');
    const totalDia = locales.reduce((s, loc) => s + (dia[loc]||0), 0);
    filas.push(`<tr><td>${fmtFecha(fecha)}</td>${cells}<td class="cell-derived big">${totalDia ? fmt$(totalDia) : '—'}</td></tr>`);
  }
  const granTotal = locales.reduce((a, l) => a + totLocales[l], 0);
  const _nomLoc = (l) => LOCALES[l]?.nombre || (l.charAt(0).toUpperCase() + l.slice(1));

  cont.innerHTML = kpiRowHtml(totLocales, 'todos') + `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th rowspan="2" style="vertical-align:bottom;">Fecha</th>
            ${locales.map(l => `<th colspan="2" class="col-${l}" style="text-align:center;">${logoLocal(l, 18) || _nomLoc(l)}</th>`).join('')}
            <th rowspan="2" style="vertical-align:bottom;">Total día</th>
          </tr>
          <tr>
            ${locales.map(l => `<th class="col-${l}">Diaria</th><th class="col-${l}">Acumulado</th>`).join('')}
          </tr>
        </thead>
        <tbody>${filas.join('')}</tbody>
        <tfoot>
          <tr class="row-total">
            <td>TOTAL</td>
            ${locales.map(l => `<td class="col-${l}" colspan="2" style="text-align:center">${fmt$(totLocales[l])}</td>`).join('')}
            <td>${fmt$(granTotal)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}

async function guardarFcOficina(fecha, localId, vId) {
  const btn = document.getElementById('btn-guardar-fcof');
  const errEl = document.getElementById('form-error');
  const valor = nmParse(document.getElementById('f-fc-of').value);
  if (errEl) { errEl.style.display='none'; errEl.textContent=''; }
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  try {
    const data = { local: localId, fecha, fc_oficina: valor, cargado_por: session.email };
    const res = vId
      ? await sb.from('ventas_diarias').update({ fc_oficina: valor }).eq('id', vId)
      : await sb.from('ventas_diarias').upsert(data, { onConflict: 'local,fecha' });
    if (res.error) throw res.error;
    cerrarModal(); toast('✓ Fc Oficina guardado'); cargar();
  } catch (e) {
    if (errEl) { errEl.textContent = e.message; errEl.style.display = 'block'; }
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
  }
}

async function enviarSolicitudCorreccion(fecha, localId, campo, valorActual) {
  const btn = document.getElementById('btn-pedir');
  const errEl = document.getElementById('form-error');
  const _propTxt = document.getElementById('f-correcto').value.trim();
  const propuesto = nmParse(_propTxt);
  const motivo = document.getElementById('f-motivo').value.trim();
  if (errEl) { errEl.style.display='none'; errEl.textContent=''; }
  if (_propTxt === '') { errEl.textContent='Poné el valor correcto'; errEl.style.display='block'; return; }
  if (!motivo || motivo.length < 5) { errEl.textContent='Escribí un motivo (mínimo 5 caracteres)'; errEl.style.display='block'; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
  try {
    const { error } = await sb.from('ventas_correcciones').insert({
      local: localId, fecha, campo,
      valor_anterior: valorActual, valor_propuesto: propuesto,
      motivo, solicitado_por: session.email,
    });
    if (error) throw error;
    // Avisar al admin con push (no esperamos, fire-and-forget)
    notificarAdminCorreccion(localId, fecha, campo, valorActual, propuesto, motivo);
    cerrarModal();
    toast('✓ Solicitud enviada. JP la va a revisar.');
    cargar();
  } catch (e) {
    if (errEl) { errEl.textContent = e.message; errEl.style.display = 'block'; }
    if (btn) { btn.disabled = false; btn.textContent = 'Enviar pedido →'; }
  }
}

async function resolverSolicitud(id, estado) {
  let comentario = '';
  if (estado === 'rechazada') {
    const resp = prompt('Comentario al rechazo (opcional):');
    if (resp === null) return;  // (10-ago) Cancelar = abortar, no rechazar
    comentario = resp;
  }
  try {
    const { error } = await sb.from('ventas_correcciones').update({
      estado,
      resuelto_por: session.email,
      comentario_admin: comentario || null,
    }).eq('id', id);
    if (error) throw error;
    toast(estado === 'aprobada' ? '✓ Aplicado a la grilla' : '✓ Rechazado');
    cerrarModal();
    refrescarBadgeSolicitudes();
    cargar();
  } catch (e) {
    toast('Error: '+e.message, true);
  }
}

async function guardarVenta(fecha, localId, vId) {
  const btn = document.getElementById('btn-guardar');
  const errEl = document.getElementById('form-error');
  const num = id => nmParse(document.getElementById(id).value);
  const intNum = id => {
    const v = document.getElementById(id).value;
    return v === '' ? 0 : parseInt(v);
  };
  const data = {
    local: localId,
    fecha: fecha,
    efectivo: num('f-efectivo'),
    tarjeta: num('f-tarjeta'),
    qr: num('f-qr'),
    vales: num('f-vales'),
    online: num('f-online'),
    fc_oficina: num('f-fc-of'),
    cant_transacciones: intNum('f-cant'),
    controlado: document.getElementById('f-controlado').checked,
    cargado_por: session.email,
    origen: 'manual',
  };
  if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  try {
    let res;
    if (vId) {
      res = await sb.from('ventas_diarias').update(data).eq('id', vId);
    } else {
      // Upsert por (local, fecha) para no romper si ya existe
      res = await sb.from('ventas_diarias').upsert(data, { onConflict: 'local,fecha' });
    }
    if (res.error) throw res.error;
    cerrarModal();
    toast('✓ Guardado');
    cargar();
  } catch (e) {
    if (errEl) { errEl.textContent = e.message || 'Error al guardar'; errEl.style.display = 'block'; }
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
  }
}

// ─── Cargar desde Dragonfish: inserta job + polling ──────────────────
// modo: '3d' (últimos 3 días, rápido) o 'mes' (mes completo, admin)
async function abrirCargaDragonfish(modo) {
  modo = modo || '3d';
  const localId = session.isAdmin ? document.getElementById('sel-local').value : session.local_id;
  if (session.isAdmin && (!localId || localId === 'todos')) {
    toast('Elegí un local específico antes', true);
    return;
  }
  const año = parseInt(document.getElementById('sel-año').value);
  const mes = parseInt(document.getElementById('sel-mes').value);

  // Calcular rango según modo
  let desde, hasta, label;
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  if (modo === 'mes') {
    desde = `${año}-${String(mes).padStart(2,'0')}-01`;
    const ultDia = new Date(año, mes, 0).getDate();
    hasta = `${año}-${String(mes).padStart(2,'0')}-${String(ultDia).padStart(2,'0')}`;
    label = `${meses[mes-1]} ${año}`;
    if (!confirm(`Resincronizar TODO ${label} de ${LOCALES[localId].nombre} desde Dragonfish.\n\nVa a sobreescribir cualquier dato manual del mes con los valores actuales del Dragonfish.\n\n¿Confirmás?`)) return;
  } else {
    // '3d' = últimos 3 días (hoy, ayer, antesdeayer)
    const hoy = new Date();
    const ant = new Date(hoy); ant.setDate(hoy.getDate() - 2);
    const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    desde = toISO(ant);
    hasta = toISO(hoy);
    label = 'últimos 3 días';
  }

  // Verificar si el mes del rango está cerrado
  const fechaCheck = new Date(desde + 'T12:00:00');
  const { data: cerrado } = await sb.from('meses_cerrados_ventas')
    .select('id').eq('local', localId)
    .eq('año', fechaCheck.getFullYear()).eq('mes', fechaCheck.getMonth()+1)
    .maybeSingle();
  if (cerrado) {
    toast(`🔒 El mes ${desde.slice(0,7)} está cerrado. Reabrir primero para sincronizar.`, true);
    return;
  }

  toast(`🐉 Pidiendo al servicio local (${label})…`);
  try {
    const { data: job, error } = await sb.from('dragonfish_jobs').insert({
      local: localId, fecha: desde,
      tipo: 'mes', fecha_desde: desde, fecha_hasta: hasta,
      estado: 'pendiente',
      solicitado_por: session.email,
    }).select().single();
    if (error) throw error;
    pollJob(job.id, localId, label);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

async function pollJob(jobId, localId, label) {
  const MAX_INTENTOS = 200;  // 200 × 3s = 10 min máximo (mes completo)
  let intentos = 0;
  const tickear = async () => {
    intentos++;
    try {
      const { data: j } = await sb.from('dragonfish_jobs').select('*').eq('id', jobId).single();
      if (!j) return;
      if (j.estado === 'completado') {
        const p = j.payload || {};
        const n = p.dias_procesados || 0;
        toast(`✓ ${LOCALES[localId]?.nombre} ${label}: ${n} día(s) sincronizado(s)`);
        cargar();
        // Después de cada sync, re-chequear si algún mes pasado quedó listo para cerrar
        chequearMesesListosParaCerrar();
        return;
      }
      if (j.estado === 'error') {
        toast(`✗ Error sync: ${j.error_msg || 'desconocido'}`, true);
        return;
      }
      if (intentos >= MAX_INTENTOS) {
        toast(`⏳ Tomando demasiado. Job #${jobId} sigue procesando.`, true);
        return;
      }
      setTimeout(tickear, 3000);
    } catch (e) {
      console.warn('poll error', e);
      setTimeout(tickear, 5000);
    }
  };
  tickear();
}

// Espera hasta que el job termine. Devuelve true si completó OK, false si falló o timeout.
async function esperarJob(jobId, timeoutSec) {
  const t0 = Date.now();
  while ((Date.now() - t0) < timeoutSec * 1000) {
    const { data: j } = await sb.from('dragonfish_jobs').select('estado, error_msg').eq('id', jobId).single();
    if (j?.estado === 'completado') return true;
    if (j?.estado === 'error') { toast(`✗ Sync error: ${j.error_msg||'desconocido'}`, true); return false; }
    await new Promise(r => setTimeout(r, 2000));
  }
  return false;
}

    const isAdmin = ADMIN_EMAILS.includes(email);

    if (URL_LOCAL && (isAdmin || local_id !== URL_LOCAL)) {

/** Cierra el turno actual del local en la fecha dada.
 *  Llama a la función SQL cerrar_turno() vía RPC y muestra el resultado. */
// ── Traba de cierre sin sync ────────────────────────────────────────
// (7-ago) Si el pre-sync de Dragonfish no confirma (daemon caído / compu
// apagada), NO se puede cerrar: los números estarían congelados a mitad
// del día (pasó el 3-ago en Unicenter y el 5-ago en Alcorta). Solo el
// admin puede forzar el cierre, con confirmación explícita.
async function _confirmarCierreSinSync(err) {
  const detalle = (err && err.message) ? `\n\nDetalle técnico: ${err.message}` : '';
  if (session?.isAdmin) {
    return confirm('⚠ NO se pudo sincronizar con Dragonfish.\n\n'
      + 'Los números de la planilla pueden estar INCOMPLETOS (si el sistema '
      + 'del local está caído, falta todo lo vendido desde que se colgó).\n\n'
      + '¿Cerrar IGUAL con los datos actuales? (solo admin)' + detalle);
  }
  alert('⚠ No se pudo sincronizar con Dragonfish.\n\n'
    + 'El cierre se CANCELA para no guardar números incompletos.\n'
    + 'Puede ser que la compu del sistema esté apagada o el sync caído.\n\n'
    + 'Probá de nuevo en unos minutos y si sigue igual avisale a JP.' + detalle);
  try {
    sb.functions.invoke('enviar-push', { body: {
      empleado_id: 3, app: 'ventas',
      title: '🛑 Cierre bloqueado sin sync',
      body: `${(session?.local_id || '?').toUpperCase()}: se intentó cerrar y el pre-sync de Dragonfish no respondió. Revisar el daemon del local.`,
      tag: 'cierre-sin-sync-' + (session?.local_id || 'x'),
    }});
  } catch (_) {}
  return false;
}

async function cerrarTurnoAhora(fecha, localId) {
  const yaCerrados = (window._turnosPorFecha?.[fecha] || []).length;
  const numero = yaCerrados + 1;
  const msg = `¿Cerrar turno ${numero} del ${fmtFecha(fecha)} en ${localId.toUpperCase()}?\n\n`
            + `Esto guarda un snapshot con los valores actuales del día menos los turnos previos.`;
  if (!confirm(msg)) return;

  const cerradoPor = session?.isAdmin
    ? `admin:${session?.email || '?'}`
    : `local:${localId}`;

  // PRE-SYNC 1/2: forzar sync de Dragonfish para el DÍA actual antes de cerrar.
  // Esto trae las últimas ventas que estaban en proceso/sin sincronizar.
  toast('🐉 Sincronizando ventas del día...');
  try {
    const { data: job, error: jobErr } = await sb.from('dragonfish_jobs').insert({
      local: localId,
      fecha: fecha,
      tipo: 'mes',         // reusamos tipo='mes' con rango de 1 día
      fecha_desde: fecha,
      fecha_hasta: fecha,
      estado: 'pendiente',
      solicitado_por: session?.email || 'cerrar_turno',
    }).select().single();
    if (jobErr) throw jobErr;
    // Esperar hasta 2 min: si la caja 2 está apagada, el sync gasta sus
    // timeouts (30s por consulta) y el job tarda ~1 min legítimamente
    const okSync = await esperarJob(job.id, 120);
    if (!okSync) throw new Error('el sync del local no respondió (daemon caído o compu apagada)');
  } catch (e) {
    console.warn('pre-sync Dragonfish falló:', e);
    if (!(await _confirmarCierreSinSync(e))) return;
  }

  // (jul 2026) El cruce MP se sacó del cierre de turno por el lag de
  // indexación de MP. El arqueo real es contra el DÍA ANTERIOR: se hace al
  // cerrar el día y en el cron de las 10:00.
  try {
    const { data, error } = await sb.rpc('cerrar_turno', {
      p_local: localId,
      p_fecha: fecha,
      p_cerrado_por: cerradoPor,
      p_notas: null,
    });
    if (error) throw error;
    toast(`✓ Turno ${data.numero} cerrado`);
    mostrarResultadoTurno(data, fecha, localId);
    // Refrescar grilla
    cargar();  // (10-ago) verPlanilla no existía — la grilla no se refrescaba
  } catch (e) {
    alert('Error al cerrar turno: ' + e.message);
  }
}

/** Push a la encargada del local cuando el arqueo MP del cierre da diferencia.
 *  Va SOLO a las encargadas (rol gerente del local) — el admin no recibe.
 *  Usa la Edge Function enviar-push en modo `local` (v9). Fire-and-forget. */
function notificarDiferenciaArqueo(dataTurno, fecha, localId, etiqueta) {
  // DESACTIVADA (jul 2026): el cruce del mismo día da falsos positivos por el
  // lag de indexación de MP (hasta 2-3 hs con pagos Point). El control real es
  // el cruce del DÍA ANTERIOR: cron `ventas_control_mp_diario` (10:00 ART)
  // cruza el día completo de ayer y avisa a la encargada solo si la
  // diferencia es real. Además `ventas_recruce_mp` (cada hora :20) limpia las
  // diferencias provisorias de los turnos.
  return;
  /* eslint-disable no-unreachable */
  try {
    const dif = Number(dataTurno?.discrepancia_mp || 0);
    if (!dif || Math.abs(dif) < 1) return;  // sin diferencia → sin notificación
    const difFmt = (dif < 0 ? '-' : '+') + '$' + Math.abs(dif).toLocaleString('es-AR');
    sb.functions.invoke('enviar-push', {
      body: {
        local: localId,
        app: 'ventas',
        title: `⚠ Diferencia en arqueo MP · ${localId.toUpperCase()}`,
        body: `El cierre de ${etiqueta} del ${fmtFecha(fecha)} dio una diferencia de ${difFmt} entre Dragonfish y la cuenta MP. Revisá el detalle en la app de Ventas.`,
        tag: `arqueo-${localId}-${fecha}`,
      },
    }).then(r => {
      if (r?.data?.sent) console.log(`Push diferencia arqueo → ${r.data.sent} notificación(es) a encargada(s)`);
    }).catch(e => console.warn('push diferencia arqueo falló:', e));
  } catch (e) {
    console.warn('notificarDiferenciaArqueo:', e);
  }
  /* eslint-enable no-unreachable */
}

/** Cierra el DÍA completo:
 *   - Si hay ventas pendientes (no cerradas en turno), crea automáticamente
 *     un turno final con todo lo restante.
 *   - Marca el día como controlado (no se pueden cerrar más turnos).
 *   Solo admin puede después reabrirlo con reabrirDiaAhora(). */
async function cerrarDiaAhora(fecha, localId) {
  const yaCerrados = (window._turnosPorFecha?.[fecha] || []).length;
  const msg = `¿Cerrar el DÍA ${fmtFecha(fecha)} en ${localId.toUpperCase()}?\n\n`
            + (yaCerrados > 0
                ? `Hay ${yaCerrados} turno${yaCerrados>1?'s':''} ya cerrado${yaCerrados>1?'s':''}. `
                : '')
            + `Si hay ventas pendientes, se cierra el turno final automáticamente.\n`
            + `Además se verifica el arqueo MP del día ANTERIOR (ya definitivo).\n\n`
            + `⚠ Después de cerrar el día, NO se podrán abrir más turnos.`;
  if (!confirm(msg)) return;

  const cerradoPor = session?.isAdmin
    ? `admin:${session?.email || '?'}`
    : `local:${localId}`;

  // PRE-SYNC Dragonfish del día actual
  toast('🐉 Sincronizando ventas del día...');
  try {
    const { data: job, error: jobErr } = await sb.from('dragonfish_jobs').insert({
      local: localId,
      fecha: fecha,
      tipo: 'mes',
      fecha_desde: fecha,
      fecha_hasta: fecha,
      estado: 'pendiente',
      solicitado_por: session?.email || 'cerrar_dia',
    }).select().single();
    if (jobErr) throw jobErr;
    const okSync = await esperarJob(job.id, 120);
    if (!okSync) throw new Error('el sync del local no respondió (daemon caído o compu apagada)');
  } catch (e) {
    console.warn('pre-sync Dragonfish falló:', e);
    if (!(await _confirmarCierreSinSync(e))) return;
  }

  try {
    const { data, error } = await sb.rpc('cerrar_dia', {
      p_local: localId,
      p_fecha: fecha,
      p_cerrado_por: cerradoPor,
      p_notas: null,
    });
    if (error) throw error;
    toast(`Día cerrado`);
    // (3-ago) El push de cierre a JP/Claudia ahora lo dispara un TRIGGER en la
    // base (trg_ventas_cierre_dia): funciona aunque el local tenga la app vieja.
    // Si se creó un turno final, mostrar su detalle
    if (data?.turno_creado) {
      mostrarResultadoTurno(data.turno_creado, fecha, localId);
    }
    // Arqueo MP del día ANTERIOR (los pagos de hoy pueden faltar por lag de MP)
    verificarArqueoAyer(fecha, localId);
    // Si estamos cerrando un día PASADO (cierre tardío), MP ya indexó todos
    // sus pagos → cruzamos también el día mismo para que quede el tilde.
    if (fecha < hoyISO()) {
      try { await sb.rpc('ventas_cruzar_dia_mp', { p_local: localId, p_fecha: fecha }); } catch (_) {}
    }
    // Refrescar grilla
    cargar();  // (10-ago) verPlanilla no existía — la grilla no se refrescaba
  } catch (e) {
    alert('Error al cerrar día: ' + e.message);
  }
}

/** Verifica el arqueo MP del DÍA ANTERIOR al que se está cerrando.
 *  A esa altura MP ya indexó todos los pagos, así que la diferencia es real. */
async function verificarArqueoAyer(fecha, localId) {
  try {
    const d = new Date(fecha + 'T12:00:00-03:00');
    d.setDate(d.getDate() - 1);
    const fAyer = d.toISOString().split('T')[0];
    const { data: dif, error } = await sb.rpc('ventas_cruzar_dia_mp', {
      p_local: localId, p_fecha: fAyer });
    if (error) throw error;
    if (dif === null) return;  // ayer no hubo planilla (ej: domingo cerrado)
    if (Math.abs(+dif) < 1) {
      toast(`✅ Arqueo MP de ayer (${fmtFecha(fAyer)}): sin diferencias`);
    } else {
      const difFmt = (+dif < 0 ? '-' : '+') + '$' + Math.abs(+dif).toLocaleString('es-AR');
      alert(`⚠ Arqueo MP de AYER (${fmtFecha(fAyer)}) en ${localId.toUpperCase()}\n\n`
          + `Diferencia de ${difFmt} entre Dragonfish y la cuenta MP.\n\n`
          + `Esta diferencia es definitiva (MP ya tiene todos los pagos de ayer).`);
      // Push a las encargadas del local (por si cerró otra persona, queda registro)
      sb.functions.invoke('enviar-push', {
        body: {
          local: localId,
          app: 'ventas',
          title: `⚠ Arqueo MP de ayer · ${localId.toUpperCase()}`,
          body: `El cruce definitivo del ${fmtFecha(fAyer)} dio diferencia de ${difFmt} entre Dragonfish y la cuenta MP. Revisá el detalle en la app de Ventas.`,
          tag: `arqueo-dia-${localId}-${fAyer}`,
        },
      }).catch(e => console.warn('push arqueo ayer falló:', e));
    }
  } catch (e) {
    console.warn('verificarArqueoAyer:', e);
  }
}

/** Vendedora solicita reabrir un día cerrado. Pide motivo y crea solicitud pendiente. */
async function solicitarReaperturaAhora(fecha, localId) {
  const motivo = prompt(`Solicitar reapertura del día ${fmtFecha(fecha)} en ${localId.toUpperCase()}.\n\nMotivo (mínimo 5 caracteres):`);
  if (!motivo || motivo.trim().length < 5) {
    if (motivo !== null) toast('El motivo debe tener al menos 5 caracteres', true);
    return;
  }
  try {
    const { data, error } = await sb.rpc('solicitar_reapertura', {
      p_local: localId,
      p_fecha: fecha,
      p_motivo: motivo.trim(),
    });
    if (error) throw error;
    toast('🙏 Solicitud enviada. El admin va a recibir el aviso.');
  } catch (e) {
    alert('Error al solicitar reapertura: ' + e.message);
  }
}

/** Bandeja de solicitudes de reapertura.
 *  Admin: ve pendientes con botones aprobar/rechazar.
 *  Vendedora: ve solo sus propias (todas, con estado). */
// ═══════════════════════════════════════════════════════════════════════
// (24-oct) CONTROL DE DÍAS CERRADOS · log de ventas_control_cerrados_log
// Lo llena la RPC ventas_control_cerrados (daemon de cada local, una vez por día).
// Acá solo se mira y se marca "visto"; la planilla no se toca sola.
// ═══════════════════════════════════════════════════════════════════════
const _CTRL_COLS = { efectivo:'Efectivo', tarjeta:'Tarjeta', qr:'MP', vales:'Vales', transferencia:'Transf.', cc:'Cta. Cte.',
                     online:'Online', fc_oficina:'Fc. Oficina', efectivo_negro:'Efectivo blue',
                     cant_transacciones:'Tickets', cant_online:'Tickets online', cant_fc_oficina:'Tickets fc. Of.' };
const _CTRL_CANT = new Set(['cant_transacciones', 'cant_online', 'cant_fc_oficina']);

async function refrescarBadgeControlCerrados() {
  const btn = document.getElementById('btn-control-cerrados');
  if (!btn) return;
  if (!session?.isAdmin) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  try {
    const { count } = await sb.from('ventas_control_cerrados_log')
      .select('id', { count: 'exact', head: true })
      .is('revisado_at', null);
    window._pendCtrl = count || 0; actualizarKebabDot();
    btn.innerHTML = `${ico('check')}<span>Días cerrados que cambiaron</span>${count > 0 ? ` <span style="background:#dc2626;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;">${count}</span>` : ''}`;
  } catch (e) { /* silent */ }
}

async function abrirControlCerrados() {
  document.getElementById('modal-control-cerrados')?.remove();
  const wrap = document.createElement('div');
  wrap.id = 'modal-control-cerrados';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  wrap.innerHTML = `
    <div style="background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:85vh;overflow:auto;padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <h3 style="margin:0;font-size:18px;">Días cerrados que cambiaron en Dragonfish</h3>
        <button onclick="cerrarControlCerrados()" title="Cerrar" style="background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;">✕</button>
      </div>
      <div style="font-size:12px;color:#64748b;margin-bottom:14px;">Cada daemon compara una vez por día los últimos 7 días ya cerrados contra lo que Dragonfish dice hoy. La planilla conserva el cierre: si hay que corregir, es a mano.</div>
      <div id="control-cerrados-body"><div style="text-align:center;color:#64748b;padding:30px;">Cargando…</div></div>
    </div>`;
  document.body.appendChild(wrap);
  const esc = (e) => { if (e.key === 'Escape') cerrarControlCerrados(); };
  document.addEventListener('keydown', esc);
  window.cerrarControlCerrados = () => { wrap.remove(); document.removeEventListener('keydown', esc); };

  const desde = new Date(Date.now() - 60 * 86400000).toISOString();
  const { data, error } = await sb.from('ventas_control_cerrados_log')
    .select('*').gte('corrida_at', desde)
    .order('corrida_at', { ascending: false }).limit(200);
  const body = document.getElementById('control-cerrados-body');
  if (!body) return;
  if (error) { body.innerHTML = `<div style="color:#dc2626;">Error: ${escHtml(error.message)}</div>`; return; }
  if (!data || !data.length) { body.innerHTML = `<div style="text-align:center;color:#64748b;padding:30px;">Ningún día cerrado cambió en los últimos 60 días.</div>`; return; }

  const renderItem = (r) => {
    const visto = !!r.revisado_at;
    const delta = +r.delta_total || 0;
    const colorDelta = delta > 0 ? '#16a34a' : (delta < 0 ? '#dc2626' : '#64748b');
    const corrida = new Date(r.corrida_at).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
    const filas = Object.entries(r.diffs || {}).map(([k, d]) => {
      const f = _CTRL_CANT.has(k) ? (x => String(Math.round(+x || 0))) : (x => (+x < 0 ? '−$ ' : '$ ') + fmt$(Math.abs(+x || 0)));
      const dl = +d.delta || 0;
      return `<tr><td style="padding:3px 8px;">${_CTRL_COLS[k] || k}</td>
        <td class="r-num" style="padding:3px 8px;text-align:right;">${f(d.guardado)}</td>
        <td class="r-num" style="padding:3px 8px;text-align:right;">${f(d.dragonfish)}</td>
        <td class="r-num" style="padding:3px 8px;text-align:right;font-weight:700;color:${dl > 0 ? '#16a34a' : (dl < 0 ? '#dc2626' : '#64748b')};">${dl > 0 ? '+' : ''}${f(dl)}</td></tr>`;
    }).join('');
    const origen = r.origen !== r.local ? `<span style="background:#f1f5f9;color:#475569;padding:1px 8px;border-radius:10px;font-size:11px;margin-left:6px;">facturas de Oficina</span>` : '';
    const [y, m] = String(r.fecha).split('-');
    const acciones = `<div style="display:flex;gap:2px;align-items:center;">
        ${abtn(`irAlDiaControl('${r.local}', ${+y}, ${+m})`, 'Ir a ese mes en la planilla', 'eye')}
        ${visto ? '' : abtn(`marcarVistoControl(${r.id})`, 'Marcar como visto', 'check', 'principal')}
      </div>`;
    return `
      <div style="border:1px solid ${visto ? '#e2e8f0' : '#fca5a5'};border-radius:8px;padding:12px;margin-bottom:10px;${visto ? 'opacity:.75;' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:700;font-size:14px;">${logoLocal(r.local, 16)} ${(NOMBRE_LOCAL?.[r.local] || r.local).toUpperCase()} · ${fmtFecha(r.fecha)}${origen}</div>
            <div style="font-size:11px;color:#64748b;">Detectado el ${corrida}${visto ? ` · visto ${new Date(r.revisado_at).toLocaleDateString('es-AR')}` : ''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-weight:700;font-size:15px;color:${colorDelta};">${delta > 0 ? '+$ ' : (delta < 0 ? '−$ ' : '$ ')}${fmt$(Math.abs(delta))}</span>
            ${acciones}
          </div>
        </div>
        <table style="width:100%;min-width:0;border-collapse:collapse;font-size:12px;margin-top:8px;">
          <thead><tr style="color:#64748b;"><th style="position:static;text-transform:none;letter-spacing:0;box-shadow:none;text-align:left;padding:3px 8px;font-weight:600;">Columna</th><th style="position:static;text-transform:none;letter-spacing:0;box-shadow:none;text-align:right;padding:3px 8px;font-weight:600;">Planilla (cerrada)</th><th style="position:static;text-transform:none;letter-spacing:0;box-shadow:none;text-align:right;padding:3px 8px;font-weight:600;">Dragonfish hoy</th><th style="position:static;text-transform:none;letter-spacing:0;box-shadow:none;text-align:right;padding:3px 8px;font-weight:600;">Diferencia</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
  };
  const pend = data.filter(r => !r.revisado_at), vistos = data.filter(r => r.revisado_at);
  body.innerHTML = `
    ${pend.length ? `<div style="font-size:12px;font-weight:700;color:#991b1b;margin:0 0 8px;">Sin revisar (${pend.length})</div>${pend.map(renderItem).join('')}` : `<div style="text-align:center;color:#16a34a;padding:14px;font-weight:600;">Nada sin revisar.</div>`}
    ${vistos.length ? `<div style="font-size:12px;font-weight:700;color:#64748b;margin:16px 0 8px;">Ya vistos (${vistos.length})</div>${vistos.map(renderItem).join('')}` : ''}`;
}

async function marcarVistoControl(id) {
  const { error } = await sb.from('ventas_control_cerrados_log')
    .update({ revisado_at: new Date().toISOString(), revisado_por: session?.user?.email || session?.nombre || 'admin' })
    .eq('id', id);
  if (error) { toast('No se pudo marcar: ' + error.message, true); return; }
  refrescarBadgeControlCerrados();
  abrirControlCerrados();
}

function irAlDiaControl(local, año, mes) {
  if (window.cerrarControlCerrados) cerrarControlCerrados(); else document.getElementById('modal-control-cerrados')?.remove();
  const sa = document.getElementById('sel-año'), sm = document.getElementById('sel-mes'), sl = document.getElementById('sel-local');
  if (sa) sa.value = String(año);
  if (sm) sm.value = String(mes);
  if (sl && session?.isAdmin) sl.value = local;
  cargar();
}

async function abrirBandejaReaperturas() {
  document.getElementById('modal-reaperturas')?.remove();
  const wrap = document.createElement('div');
  wrap.id = 'modal-reaperturas';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  wrap.innerHTML = `
    <div style="background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 style="margin:0;font-size:18px;">Reaperturas</h3>
        <button onclick="document.getElementById('modal-reaperturas').remove();" style="background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;">✕</button>
      </div>
      <div id="reaperturas-body"><div style="text-align:center;color:#64748b;padding:30px;">Cargando…</div></div>
    </div>`;
  document.body.appendChild(wrap);

  // Cargar solicitudes (RLS ya filtra: admin ve todo, vendedora ve solo lo suyo)
  const { data, error } = await sb.from('ventas_reaperturas')
    .select('*')
    .order('solicitado_at', { ascending: false })
    .limit(50);
  if (error) {
    document.getElementById('reaperturas-body').innerHTML = `<div style="color:#dc2626;">Error: ${escHtml(error.message)}</div>`;
    return;
  }
  if (!data || !data.length) {
    document.getElementById('reaperturas-body').innerHTML = `<div style="text-align:center;color:#64748b;padding:30px;">No hay solicitudes.</div>`;
    return;
  }

  const pendientes = data.filter(r => r.estado === 'pendiente');
  const resueltas  = data.filter(r => r.estado !== 'pendiente');

  const renderItem = (r) => {
    const colorEstado = r.estado === 'pendiente' ? '#fbbf24' : (r.estado === 'aprobada' ? '#22c55e' : '#dc2626');
    const labelEstado = r.estado === 'pendiente' ? 'Pendiente' : (r.estado === 'aprobada' ? '✓ Aprobada' : '✗ Rechazada');
    const fechaHora = new Date(r.solicitado_at).toLocaleString('es-AR', { dateStyle:'short', timeStyle:'short' });
    const acciones = (session?.isAdmin && r.estado === 'pendiente')
      ? `<div style="display:flex;gap:6px;margin-top:10px;">
           <button onclick="resolverReaperturaAhora(${r.id}, true)" style="flex:1;background:#16a34a;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;">✓ Aprobar y reabrir</button>
           <button onclick="resolverReaperturaAhora(${r.id}, false)" style="flex:1;background:#dc2626;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;">✗ Rechazar</button>
         </div>`
      : '';
    const comentario = r.comentario_admin
      ? `<div style="margin-top:6px;padding:6px 10px;background:#f1f5f9;border-radius:4px;font-size:12px;color:#475569;"><b>Admin:</b> ${escHtml(r.comentario_admin)}</div>`
      : '';
    return `
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;">
          <div>
            <div style="font-weight:700;font-size:14px;">${r.local.toUpperCase()} · ${fmtFecha(r.fecha)}</div>
            <div style="font-size:11px;color:#64748b;">${fechaHora} · ${escHtml(r.solicitado_por)}</div>
          </div>
          <span style="background:${colorEstado};color:#fff;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;">${labelEstado}</span>
        </div>
        <div style="font-size:13px;color:#1e293b;background:#f8fafc;padding:8px 10px;border-radius:4px;border-left:3px solid #c4b5fd;">${escHtml(r.motivo)}</div>
        ${comentario}
        ${acciones}
      </div>`;
  };

  document.getElementById('reaperturas-body').innerHTML = `
    ${pendientes.length ? `<div style="font-weight:600;color:#92400e;margin-bottom:8px;">⏳ Pendientes (${pendientes.length})</div>${pendientes.map(renderItem).join('')}` : '<div style="color:#64748b;font-size:13px;margin-bottom:10px;">No hay pendientes.</div>'}
    ${resueltas.length ? `<div style="font-weight:600;color:#475569;margin:14px 0 8px;">Historial</div>${resueltas.map(renderItem).join('')}` : ''}`;
}

/** Admin aprueba o rechaza una solicitud. */
async function resolverReaperturaAhora(id, aprobar) {
  const accion = aprobar ? 'aprobar' : 'rechazar';
  const comentario = prompt(`Comentario para la vendedora (opcional):`);
  if (comentario === null) return;  // canceló
  if (!confirm(`¿Confirmás ${accion} la solicitud?${aprobar ? '\n\nEl día se va a reabrir y la próxima sincronización va a actualizar los valores.' : ''}`)) return;
  try {
    const { data, error } = await sb.rpc('resolver_reapertura', {
      p_id: id,
      p_aprobar: aprobar,
      p_comentario: comentario.trim() || null,
    });
    if (error) throw error;
    toast(aprobar ? '✓ Aprobada · día reabierto' : '✗ Rechazada');
    abrirBandejaReaperturas();  // refrescar
    cargar();  // (10-ago) fix: verPlanilla no existía
  } catch (e) {
    alert('Error al resolver: ' + e.message);
  }
}

/** Actualiza el badge del botón Reaperturas con contador de pendientes (solo admin). */
async function refrescarBadgeReaperturas() {
  if (!session?.isAdmin) {
    document.getElementById('btn-reaperturas').innerHTML = ico('key') + '<span>Reaperturas</span>';
    return;
  }
  try {
    const { count } = await sb.from('ventas_reaperturas')
      .select('id', { count: 'exact', head: true })
      .eq('estado', 'pendiente');
    window._pendReap = count || 0; actualizarKebabDot();
    const btn = document.getElementById('btn-reaperturas');
    if (btn) {
      btn.innerHTML = `${ico('key')}<span>Reaperturas</span>${count > 0 ? ` <span style="background:#dc2626;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;">${count}</span>` : ''}`;
    }
  } catch (e) { /* silent */ }
}

/** Reabre un día previamente cerrado. Solo admin. */
async function reabrirDiaAhora(fecha, localId) {
  if (!session?.isAdmin) {
    toast('Solo admin puede reabrir un día cerrado', true);
    return;
  }
  if (!confirm(`¿Reabrir el día ${fmtFecha(fecha)} en ${localId.toUpperCase()}?\n\nVa a permitir cerrar nuevos turnos en ese día.`)) return;
  try {
    const { error } = await sb.rpc('reabrir_dia', {
      p_local: localId,
      p_fecha: fecha,
      p_por: session?.email || 'admin',
    });
    if (error) throw error;
    toast('🔓 Día reabierto');
    cargar();  // (10-ago) fix: verPlanilla no existía
  } catch (e) {
    alert('Error al reabrir día: ' + e.message);
  }
}

/** Modal con el detalle del último turno cerrado: valores + discrepancia con MP. */
function mostrarResultadoTurno(turno, fecha, localId) {
  document.getElementById('modal-turno')?.remove();
  const wrap = document.createElement('div');
  wrap.id = 'modal-turno';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';

  const t = turno;
  const tieneDisc = t.discrepancia_mp !== null && Math.abs(t.discrepancia_mp) >= 1;
  const colorDisc = tieneDisc ? '#dc2626' : '#16a34a';
  const movs = t.mp_movs_no_match || [];
  const horaDesde = new Date(t.desde).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
  const horaHasta = new Date(t.hasta).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});

  wrap.innerHTML = `
    <div style="background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:18px;">Turno ${t.numero} · ${localId.toUpperCase()} · ${fmtFecha(fecha)}</h3>
        <button onclick="document.getElementById('modal-turno').remove();" style="background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;padding:0 6px;">✕</button>
      </div>
      <div style="font-size:13px;color:#64748b;margin-bottom:16px;">
        ${horaDesde} → ${horaHasta} · cerrado por ${escHtml(t.cerrado_por || '?')}
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;">
        <div style="background:#f8fafc;padding:12px;border-radius:8px;">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Efectivo</div>
          <div style="font-size:18px;font-weight:700;">${fmt$(+t.efectivo||0)}</div>
        </div>
        ${(+t.efectivo_negro > 0) ? `
        <div style="background:#f8fafc;padding:12px;border-radius:8px;">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Efectivo B2</div>
          <div style="font-size:18px;font-weight:700;">${fmt$(+t.efectivo_negro||0)}</div>
          <div style="font-size:10px;color:#94a3b8;">misma caja física · incluido en Online</div>
        </div>
        ` : ''}
        <div style="background:#f8fafc;padding:12px;border-radius:8px;">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">MP Dragonfish</div>
          <div style="font-size:18px;font-weight:700;">${fmt$(+t.qr||0)}</div>
        </div>
        ${(fecha <= FECHA_FIN_TARJETA || +t.tarjeta > 0) ? `
        <div style="background:#f8fafc;padding:12px;border-radius:8px;">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Tarjeta (Clover)</div>
          <div style="font-size:18px;font-weight:700;">${fmt$(+t.tarjeta||0)}</div>
        </div>
        ` : ''}
        ${(+t.transferencia > 0) ? `
        <div style="background:#f8fafc;padding:12px;border-radius:8px;">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Transferencia</div>
          <div style="font-size:18px;font-weight:700;">${fmt$(+t.transferencia||0)}</div>
        </div>
        ` : ''}
        ${(+t.cc > 0) ? `
        <div style="background:#f8fafc;padding:12px;border-radius:8px;">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Cuenta Corriente</div>
          <div style="font-size:18px;font-weight:700;">${fmt$(+t.cc||0)}</div>
        </div>
        ` : ''}
        <div style="background:#f8fafc;padding:12px;border-radius:8px;">
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;">Vales</div>
          <div style="font-size:18px;font-weight:700;">${fmt$(+t.vales||0)}</div>
        </div>
      </div>

      ${t.mp_cuenta !== null ? `
        <div style="background:${tieneDisc?'#fef2f2':'#f0fdf4'};border-left:4px solid ${colorDisc};border-radius:8px;padding:14px 16px;margin-bottom:16px;">
          <div style="font-size:12px;font-weight:600;color:${colorDisc};text-transform:uppercase;margin-bottom:6px;">

              <div style="font-size:11px;color:#64748b;">MP cuenta dijo</div>

              <div style="font-size:11px;color:${colorDisc};">Diferencia</div>

          // Hora DF | Factura | Importe | Pago MP | Hora MP | Match
          const data = t.mp_movs_no_match || {};
          const movsCuenta = Array.isArray(data) ? data : (data.movs_cuenta || []);
          const txsDf      = Array.isArray(data) ? [] : (data.txs_dragonfish || []);
          const summary    = data.summary || null;
          if (!movsCuenta.length && !txsDf.length) return '';
          // Hora compacta en 24h (sin "a.m./p.m." que ocupa más)
          const fmtHora = (s) => {
            if (!s) return '—';
            const d = new Date(s);
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          };

          // Pairing greedy: para cada tx DF, buscar el primer mov MP no usado con
          // mismo importe. Lo demás queda como solo-DF o solo-MP al final.
          const pares = [];
          const usados = new Set();
          txsDf.forEach(df => {
            const idx = movsCuenta.findIndex((mp, i) => !usados.has(i) && +mp.importe === +df.importe);
            if (idx !== -1) {
              usados.add(idx);
              pares.push({ df, mp: movsCuenta[idx], match: true });
            } else {
              pares.push({ df, mp: null, match: false });
            }
          });
          // Movs MP que quedaron sin pareja
          movsCuenta.forEach((mp, i) => {
            if (!usados.has(i)) pares.push({ df: null, mp, match: false });
          });
          // Ordenar: primero los sin match (arriba, lo que importa), después matches
          pares.sort((a, b) => (a.match === b.match) ? 0 : (a.match ? 1 : -1));

          // Súper compactar la factura: "B 0020-00055483" → "B-55483"
          // (saca el punto de venta porque siempre es el mismo).
          const fmtFactura = (s) => {
            if (!s) return '—';
            return s.replace(/^([A-Z])\s+\d{4}-0*(\d+)$/, '$1-$2');
          };

          // CSS GRID 4 columnas: Factura | Importe | Pago MP | ✓
          // Sin tabla — Grid evita los huecos.
          const renderPar = (p) => {
            const bg = p.match ? '#fff' : '#fef2f2';
            const checkmark = p.match
              ? '<span style="color:#16a34a;font-weight:700;">✓</span>'
              : '<span style="color:#dc2626;font-weight:700;">✗</span>';
            return `
              <div style="display:grid;grid-template-columns:1fr 110px 110px 40px;align-items:center;border-top:1px solid #f1f5f9;background:${bg};font-size:11px;">
                <div style="padding:4px 8px;font-size:10px;color:#475569;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.df ? escHtml(fmtFactura(p.df.numero_comprobante)) : '—'}</div>
                <div style="padding:4px 8px;text-align:right;font-weight:600;white-space:nowrap;">${p.df ? fmt$(+p.df.importe) : '—'}</div>
                <div style="padding:4px 8px;text-align:right;font-weight:600;color:#7c3aed;white-space:nowrap;">${p.mp ? fmt$(+p.mp.importe) : '—'}</div>
                <div style="padding:4px 4px;text-align:center;">${checkmark}</div>
              </div>`;
          };

          return `
            ${summary ? `
              <div style="display:flex;gap:14px;flex-wrap:wrap;background:#f8fafc;padding:10px 14px;border-radius:6px;margin-bottom:10px;font-size:12px;">
                <div><strong>Dragonfish:</strong> ${summary.df_n} fact ${summary.df_sin_match > 0 ? `<span style="color:#dc2626;">(${summary.df_sin_match} sin pago)</span>` : ''}</div>
                <div><strong>MP cuenta:</strong> ${summary.cuenta_n} pagos ${summary.cuenta_sin_match > 0 ? `<span style="color:#dc2626;">(${summary.cuenta_sin_match} sin factura)</span>` : ''}</div>
              </div>
            ` : ''}
            <details ${tieneDisc?'open':''} style="margin-bottom:8px;">
              <summary style="cursor:pointer;font-weight:600;color:#475569;padding:8px 0;">
                ▶ Comparar factura por pago (${pares.length})
              </summary>
              <div style="background:#fff;border:1px solid #e2e8f0;border-radius:6px;max-height:340px;overflow-y:auto;overflow-x:hidden;margin-top:8px;">
                <div style="display:grid;grid-template-columns:1fr 110px 110px 40px;background:#f8fafc;font-size:10px;font-weight:600;color:#475569;position:sticky;top:0;border-bottom:1px solid #e2e8f0;">
                  <div style="padding:6px 8px;">Factura</div>
                  <div style="padding:6px 8px;text-align:right;">Importe</div>
                  <div style="padding:6px 8px;text-align:right;">Pago MP</div>
                  <div style="padding:6px 4px;text-align:center;">✓</div>
                </div>
                ${pares.map(renderPar).join('')}
              </div>
              <div style="margin-top:8px;font-size:11px;color:#64748b;line-height:1.4;">
                <strong>✗ Factura sin pago MP</strong> = venta cargada pero el pago no entró a Mercado Pago.<br>
                <strong>✗ Pago sin factura</strong> = pago entró a MP pero no se cargó en el POS Dragonfish.
              </div>
            </details>
          `;
        })()}
      ` : '<div style="color:#64748b;font-size:13px;text-align:center;padding:8px;">Cuenta MP no disponible para este local — sin cruce automático.</div>'}

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
        <button onclick="document.getElementById('modal-turno').remove();" style="background:#7c3aed;color:#fff;border:none;border-radius:6px;padding:10px 20px;cursor:pointer;font-size:13px;font-weight:600;">OK, listo</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
}

/** Lista los turnos cerrados de un día con sus discrepancias. */
/** Lista los turnos cerrados de un día con sus discrepancias. */
function abrirTurnos(fecha, localId) {
  const turnosDia = window._turnosPorFecha?.[fecha] || [];
  if (!turnosDia.length) { toast('Este día no tiene turnos cerrados'); return; }

  document.getElementById('modal-turno')?.remove();
  const wrap = document.createElement('div');
  wrap.id = 'modal-turno';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';

  wrap.innerHTML = `
    <div style="background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-width:780px;width:100%;max-height:85vh;overflow:auto;padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 style="margin:0;font-size:18px;">Turnos · ${localId.toUpperCase()} · ${fmtFecha(fecha)}</h3>
        <button onclick="document.getElementById('modal-turno').remove();" style="background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;padding:0 6px;">✕</button>
      </div>
      ${turnosDia.map(t => {
        const tieneDisc = t.discrepancia_mp !== null && Math.abs(t.discrepancia_mp) >= 1;
        const colorDisc = tieneDisc ? '#dc2626' : '#16a34a';
        const horaDesde = new Date(t.desde).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
        const horaHasta = new Date(t.hasta).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
        return `
          <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
              <div style="font-weight:700;font-size:15px;">Turno ${t.numero} <span style="font-weight:400;color:#64748b;font-size:12px;">· ${horaDesde} → ${horaHasta}</span></div>
              <div style="font-size:11px;color:#64748b;">por ${escHtml(t.cerrado_por || '?')}</div>
            </div>
            ${(() => {
              const celdas = [];
              const c = (lbl, val, bold, extra) => celdas.push(`<div><div style="color:#64748b;text-transform:uppercase;font-size:10px;">${lbl}</div><div style="font-weight:${bold?700:600};">${fmt$(val)}</div>${extra||''}</div>`);
              c('Efectivo', +t.efectivo||0);
              // Efectivo de la base 2: va en la MISMA caja física (no suma al
              // total porque ya está incluido dentro de Online)
              if (+t.efectivo_negro > 0) c('Efectivo B2', +t.efectivo_negro, false, `<div style="font-size:9px;color:#94a3b8;">misma caja física</div>`);
              if (fecha <= FECHA_FIN_TARJETA || +t.tarjeta > 0) c('Tarjeta', +t.tarjeta||0);
              c('MP', +t.qr||0);
              if (+t.transferencia > 0) c('Transf.', +t.transferencia);
              if (+t.cc > 0) c('Cta. Cte.', +t.cc);
              c('Total', +t.total_turno||0, true);
              return `<div style="display:grid;grid-template-columns:repeat(${Math.min(celdas.length,4)},1fr);gap:8px;font-size:12px;">${celdas.join('')}</div>`;
            })()}
            ${t.mp_cuenta !== null ? `
              <div style="margin-top:10px;padding:8px 12px;background:${tieneDisc?'#fef2f2':'#f0fdf4'};border-left:3px solid ${colorDisc};border-radius:4px;font-size:12px;">
                Cuenta MP: ${fmt$(+t.mp_cuenta)} · Diferencia: <strong style="color:${colorDisc};">${tieneDisc?'⚠ ':''}${fmt$(+t.discrepancia_mp)}</strong>
                ${tieneDisc ? `<button class="abtn peligro" onclick="event.stopPropagation();mostrarResultadoTurno(${JSON.stringify(t).replace(/"/g,'&quot;')}, '${fecha}', '${localId}')" title="Ver el detalle de la diferencia con MP" aria-label="Ver detalle">${ico('search')}</button>` : ''}
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
        <button onclick="document.getElementById('modal-turno').remove();" style="background:#7c3aed;color:#fff;border:none;border-radius:6px;padding:10px 20px;cursor:pointer;font-size:13px;font-weight:600;">OK</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});

<script>
// (24-ago) Blindaje iOS: re-suscripcion automatica de push. iOS suelta la
// suscripcion silenciosamente cada tanto; si el permiso sigue concedido y
// esta usuaria YA tenia la campanita activa en ESTA app (hay fila propia,
// no del hub), se renueva sola al abrir. Si la apago a proposito (fila
// borrada), no se toca. Regla viva: mantener igual en las 4 apps + hub.
(async function _autoResubPush() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (typeof pushManager === 'undefined' || !pushManager.soportado()) return;
    const { data: { session: _s } } = await sb.auth.getSession();
    if (!_s) return;
    let _emp = null, _gen = null;
    try {
      const { data: u } = await sb.rpc('rrhh_current_user');
      const _u = Array.isArray(u) ? u[0] : u;
      _emp = _u?.empleado_id ?? null;
      if (!_emp) _gen = _u?.local_gerencia ?? null;
    } catch (_) {}
    if (!_emp && !_gen) return;
    let q = sb.from('rrhh_push_subscriptions').select('id')
      .eq('app', 'ventas').or('plataforma.is.null,plataforma.neq.hub').limit(1);
    q = _emp ? q.eq('empleado_id', _emp) : q.eq('local_generico', _gen);
    const { data: filas } = await q;
    if (!filas || !filas.length) return;
    await pushManager.activar();
  } catch (_) {}
})();
</script>
